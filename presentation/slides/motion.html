<h2 style="font-family:'Noto Serif SC', Georgia, serif;font-size:52px;font-weight:700;line-height:1.25">关键动作和状态</h2>
<p style="font-size:28px;line-height:1.55;color:#3F4A57">右上角是控制器状态。红色条是坐垫和臀部、大腿的接触区，颜色越深压强越高。放手后座板停在原处。</p>

<aside>这段示意动画由我们的二维模型直接画出：一位 1.60 米的用户双手握住身前横杆起身，座板沿着机构的曲线跟着大腿走。红色条是坐垫和身体的接触区，颜色越深压强越高；可以看到前半程推在臀部和大腿根部，后半程推在大腿上。放手以后，座板停在原来的位置。右上角是控制器的状态。正式版会换成 SolidWorks 的运动动画。</aside>
