<h2 style="font-family:'Noto Serif SC', Georgia, serif;font-size:52px;font-weight:700;line-height:1.25">关键动作和状态</h2>
<p style="font-size:28px;line-height:1.55;color:#3F4A57">右上角是控制器状态。红色条是坐垫和臀部、大腿的接触区，颜色越深压强越高。放手后座板停在原处。</p>
<div style="display:flex;flex-direction:column;gap:10px"><img src="/_blob/f86377b05d96d054f2490b3a42ce1098" alt="CAD 模型的三个位置：与床齐平、行程中间、最高处" style="width:488px;height:160px;object-fit:contain;background:#FFFFFF;border-radius:16px;border:1px solid #E2DED5"><p style="font-size:24px;line-height:1.45;color:#66707C">CAD 模型的三个位置：齐平 → 中间 → 最高（0.69 m）</p></div>
</div>
<aside>这段示意动画由我们的二维模型直接画出：一位 1.60 米的用户双手握住身前横杆起身，座板沿着机构的曲线跟着大腿走。红色条是坐垫和身体的接触区，颜色越深压强越高；可以看到前半程推在臀部和大腿根部，后半程推在大腿上。放手以后，座板停在原来的位置。右上角是控制器的状态。右下角是 CAD 模型在三个位置的样子，和动画用的是同一套尺寸。</aside>
