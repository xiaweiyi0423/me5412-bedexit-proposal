<aside>这是短片里的四步，机构按真实运动学驱动：挪上座板、握紧开关、一起起身、松手即停。起身时座板往前、往上并前倾，读数最大约 16 度，离座时约 13 度。右下是二维模型：红色是坐垫接触区，前半程托臀部、后半程托大腿，所以人不往前滑。</aside>
