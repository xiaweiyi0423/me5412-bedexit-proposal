<aside>总结：平时和床一样低，起身时座板跟着大腿托一程。省力和抬高床相当；更重要的是腿一软时，起身大半程都有座板在臀部下面。机构是一个电机带斜导轨和倾角连杆，封闭在床头一侧；控制上松手即停、只有按住才降、速度跟着人走。</aside>
